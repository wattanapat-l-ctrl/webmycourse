<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการตารางเรียน - สำหรับครู</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; }
        .card { border: none; border-radius: 15px; }
        .table-container { background: white; padding: 20px; border-radius: 15px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MyCourse Teacher</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="index.html"><i class="bi bi-house-door me-1"></i> กลับหน้าหลัก</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-8">
                <h2 class="fw-bold">จัดการตารางเรียน</h2>
                <p class="text-muted">วิชาที่รับผิดชอบ: <span id="courseBadge" class="badge bg-info text-dark fs-6">กำลังโหลด...</span></p>
            </div>
            <div class="col-md-4 text-md-end">
                <button class="btn btn-success rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#addScheduleModal">
                    <i class="bi bi-plus-circle me-1"></i> เพิ่มเวลาเรียน
                </button>
            </div>
        </div>

        <div class="table-container shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>วันเรียน</th>
                            <th>เวลาเริ่ม</th>
                            <th>เวลาสิ้นสุด</th>
                            <th>ห้องเรียน/ลิงก์</th>
                            <th class="text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleTableBody">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">กำลังโหลดตารางเรียน...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addScheduleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">เพิ่มเวลาเรียนใหม่</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addScheduleForm">
                        <div class="mb-3">
                            <label class="form-label">วันที่สอน</label>
                            <select class="form-select" id="dayOfWeek" required>
                                <option value="จันทร์">จันทร์</option>
                                <option value="อังคาร">อังคาร</option>
                                <option value="พุธ">พุธ</option>
                                <option value="พฤหัสบดี">พฤหัสบดี</option>
                                <option value="ศุกร์">ศุกร์</option>
                                <option value="เสาร์">เสาร์</option>
                                <option value="อาทิตย์">อาทิตย์</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">เวลาเริ่ม</label>
                                <input type="time" class="form-control" id="startTime" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">เวลาสิ้นสุด</label>
                                <input type="time" class="form-control" id="endTime" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ลิงก์เข้าเรียน หรือ เลขห้อง</label>
                            <input type="text" class="form-control" id="room" placeholder="เช่น Google Meet Link หรือ ห้อง 402" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill">บันทึกข้อมูล</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    
    <script>
        const user = getLoggedInUser();

        // 1. ตรวจสอบสิทธิ์เบื้องต้น
        if (!user || (user.role.toLowerCase() !== 'teacher' && user.role.toLowerCase() !== 'admin')) {
            alert('คุณไม่มีสิทธิ์เข้าถึงหน้านี้');
            window.location.href = 'index.html';
        }

        const courseName = user.assigned_course || "";

        document.addEventListener('DOMContentLoaded', () => {
            if (!courseName || courseName === "ไม่ได้ระบุวิชา") {
                document.getElementById('courseBadge').textContent = "ยังไม่ได้มอบหมายวิชา";
                document.getElementById('courseBadge').className = "badge bg-danger fs-6";
                document.getElementById('scheduleTableBody').innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger">บัญชีของคุณยังไม่ได้รับการมอบหมายวิชา กรุณาติดต่อ Admin</td></tr>`;
            } else {
                document.getElementById('courseBadge').textContent = courseName;
                loadCourseData();
            }

            // 2. ระบบบันทึกข้อมูล (Update ลงตาราง courses)
            document.getElementById('addScheduleForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...';

                // รวมข้อมูล วัน-เวลา เป็นข้อความเดียว
                const day = document.getElementById('dayOfWeek').value;
                const start = document.getElementById('startTime').value;
                const end = document.getElementById('endTime').value;
                const scheduleString = `${day} เวลา ${start} - ${end} น.`;
                
                // รับลิงก์ Google Meet
                let meetingLink = document.getElementById('room').value.trim();
                
                // ตรวจสอบเบื้องต้น: ถ้าอาจารย์ลืมใส่ https:// ให้ระบบเติมให้เอง
                if (meetingLink && !meetingLink.startsWith('http')) {
                    meetingLink = 'https://' + meetingLink;
                }

                const { error } = await supabaseClient
                    .from('courses')
                    .update({ 
                        schedule: scheduleString, 
                        meeting_link: meetingLink,
                        instructor: user.fullname 
                    })
                    .ilike('course_name', courseName.trim());

                if (error) {
                    alert('เกิดข้อผิดพลาด: ' + error.message);
                } else {
                    alert('บันทึกข้อมูลสำเร็จ! นักเรียนสามารถกดเข้าเรียนได้ทันที');
                    location.reload();
                }
                btn.disabled = false;
            });
        });

        // 3. โหลดข้อมูลปัจจุบันมาแสดง
        async function loadCourseData() {
            const tableBody = document.getElementById('scheduleTableBody');
            
            const { data, error } = await supabaseClient
                .from('courses')
                .select('*')
                .ilike('course_name', courseName.trim())
                .maybeSingle();

            if (error) {
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">เกิดข้อผิดพลาด: ${error.message}</td></tr>`;
                return;
            }

            if (!data || (!data.schedule && !data.meeting_link)) {
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">ยังไม่ได้ระบุวันเวลาเรียนและลิงก์ Google Meet</td></tr>`;
                return;
            }

            tableBody.innerHTML = `
                <tr>
                    <td><span class="badge bg-primary">${data.schedule ? data.schedule.split(' ')[0] : '-'}</span></td>
                    <td colspan="2" class="fw-bold">${data.schedule || '-'}</td>
                    <td>
                        <a href="${data.meeting_link}" target="_blank" class="text-truncate d-inline-block text-success fw-bold" style="max-width: 250px;">
                            <i class="bi bi-camera-video-fill me-1"></i> ${data.meeting_link || 'ไม่มีลิงก์'}
                        </a>
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-danger" onclick="clearSchedule()">
                            <i class="bi bi-eraser"></i> ล้างข้อมูล
                        </button>
                    </td>
                </tr>
            `;

            // ดึงลิงก์เดิมมาใส่ในช่องกรอกให้อัตโนมัติเวลาเปิด Modal
            if (data.meeting_link) {
                document.getElementById('room').value = data.meeting_link.replace('https://', '');
            }
        }

        async function clearSchedule() {
            if (confirm('คุณต้องการลบข้อมูลตารางเรียนและลิงก์เข้าเรียนใช่หรือไม่?')) {
                const { error } = await supabaseClient
                    .from('courses')
                    .update({ schedule: null, meeting_link: null })
                    .ilike('course_name', courseName.trim());
                
                if (error) alert(error.message);
                else location.reload();
            }
        }
    </script>
</body>
</html>
